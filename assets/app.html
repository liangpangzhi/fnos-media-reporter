<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>飞牛 NAS 影音库统计</title>
<style>
  * { box-sizing: border-box; }
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2331; --line:#2a3343;
    --txt:#e6edf3; --sub:#8b98a9; --acc:#4f8cff; --acc2:#7c5cff;
    --ok:#3fb950; --warn:#d29922; --err:#f85149;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:13px;}
  #app{display:flex;height:100%;}

  /* 左侧控制栏 */
  #side{width:340px;min-width:340px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);}
  #brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);}
  #brand h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.3px;}
  #brand p{margin:6px 0 0;font-size:11.5px;color:var(--sub);line-height:1.5;}
  #form{padding:16px 18px;overflow-y:auto;flex:1;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;}
  .field input{width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;color:var(--txt);font-size:12.5px;outline:none;transition:.15s;}
  .field input:focus{border-color:var(--acc);background:#1e2836;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .row2>div.small{flex:0 0 84px;}
  textarea{width:100%;min-height:64px;padding:8px 10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:12px;
    font-family:Consolas,monospace;resize:vertical;outline:none;line-height:1.6;}
  textarea:focus{border-color:var(--acc);}
  .check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);margin:2px 0 14px;}
  .check input{width:14px;height:14px;accent-color:var(--acc);}
  .btn{width:100%;padding:10px;border:none;border-radius:6px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;margin-bottom:9px;}
  .btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--acc);color:var(--acc);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  #tip{margin-top:10px;padding:10px;border-radius:6px;font-size:11.5px;line-height:1.65;display:none;}
  #tip.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35);color:#7ee787;display:block;}
  #tip.warn{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.35);color:#e3b341;display:block;}
  #tip.err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.35);color:#ff7b72;display:block;}

  /* 右侧主区 */
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #topbar{height:46px;min-height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;
    border-bottom:1px solid var(--line);background:var(--panel);}
  #pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
    background:var(--panel2);font-size:11.5px;color:var(--sub);border:1px solid var(--line);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sub);}
  .dot.run{background:var(--acc);animation:blink 1.1s infinite;}
  .dot.done{background:var(--ok);} .dot.err{background:var(--err);}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  #metrics{margin-left:auto;display:flex;gap:20px;font-size:11.5px;color:var(--sub);}
  #metrics b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums;}

  #stage{flex:1;position:relative;display:flex;overflow:hidden;}
  #welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;color:var(--sub);gap:8px;padding:30px;}
  #welcome h2{font-size:17px;color:var(--txt);margin:0 0 4px;font-weight:600;}
  #welcome p{margin:0;font-size:12.5px;line-height:1.9;max-width:520px;}
  #welcome code{background:var(--panel2);padding:1px 6px;border-radius:4px;color:#79c0ff;font-size:11.5px;}

  #logs{width:100%;height:100%;overflow-y:auto;padding:14px 18px;font-family:Consolas,monospace;
    font-size:11.5px;line-height:1.85;color:var(--sub);display:none;}
  #logs .l{white-space:pre-wrap;word-break:break-all;}
  #logs .l.hi{color:var(--txt);}
  #logs .l.er{color:var(--err);}

  #reportFrame{width:100%;height:100%;border:none;display:none;background:#fff;}
  #mtubar{display:none;padding:11px 16px;background:rgba(210,153,34,.09);
    border-bottom:1px solid rgba(210,153,34,.35);font-size:12px;line-height:1.7;color:#e3b341;}
  #mtubar b{color:#f0c674;}
  #mtubar .acts{margin-top:6px;display:flex;gap:10px;align-items:center;}
  #mtubar button{padding:5px 13px;border-radius:5px;border:1px solid rgba(210,153,34,.5);
    background:rgba(210,153,34,.14);color:#f0c674;font-size:11.5px;cursor:pointer;font-family:inherit;}
  #mtubar button:hover{background:rgba(210,153,34,.26);}
  #mtubar button:disabled{opacity:.5;cursor:not-allowed;}
  #mtubar code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:3px;font-size:11px;}
  #progressWrap{padding:0 18px 14px;display:none;}
  #bar{height:4px;background:var(--panel2);border-radius:3px;overflow:hidden;}
  #barIn{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#30394a;border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#3d4759;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand">
      <h1>飞牛 NAS 影音库统计</h1>
      <p>通过 SSH 只读采集影音文件，本地生成统计报表</p>
    </div>
    <div id="form">
      <div class="field">
        <label>主机地址 / Tailscale IP</label>
        <input id="host" placeholder="192.168.1.100 或 100.x.x.x" spellcheck="false">
      </div>
      <div class="row2">
        <div class="field">
          <label>用户名</label>
          <input id="user" placeholder="你的 NAS 账号" spellcheck="false">
        </div>
        <div class="field small">
          <label>端口</label>
          <input id="port" value="22" spellcheck="false">
        </div>
      </div>
      <div class="field">
        <label>密码（Tailscale SSH 可留空）</label>
        <input id="password" type="password" placeholder="留空则免密登录">
      </div>
      <div class="field">
        <label>扫描根目录（逗号分隔）</label>
        <textarea id="roots" spellcheck="false">/vol1/1000
/vol2/1000
/vol3/1000
/vol4/1000
/vol5/1000
/vol6/1000
/vol7/1000
/vol8/1000</textarea>
      </div>
      <div class="check">
        <input type="checkbox" id="savePwd"><label for="savePwd" style="margin:0">记住密码</label>
      </div>
      <button class="btn btn-ghost" id="btnTest">测试连接</button>
      <button class="btn btn-primary" id="btnScan">开始采集</button>
      <button class="btn btn-ghost" id="btnDir">打开报表目录</button>
      <div id="tip"></div>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <span id="pill"><span class="dot" id="dot"></span><span id="pillTxt">就绪</span></span>
      <div id="metrics">
        <span>视频 <b id="mFiles">0</b></span>
        <span>附属 <b id="mSubs">0</b></span>
        <span>数据 <b id="mBytes">0 KB</b></span>
        <span>耗时 <b id="mTime">0s</b></span>
      </div>
    </div>
    <div id="progressWrap"><div id="bar"><div id="barIn"></div></div></div>
    <div id="mtubar"></div>
    <div id="stage">
      <div id="welcome">
        <h2>填写左侧连接信息后开始采集</h2>
        <p>程序通过 SSH 以只读方式扫描 NAS 上的视频与字幕文件，全部解析与统计在本机完成，不会修改 NAS 上任何文件。<br>
        若不确定目录，可先点「测试连接」检查路径是否可访问。<br>
        Tailscale 直连时通常免密登录，密码仅在需要 sudo 的场景使用。</p>
      </div>
      <div id="logs"></div>
      <iframe id="reportFrame"></iframe>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let timer = null, started = 0;

function tip(msg, kind){
  const t = $('tip');
  t.className = kind || '';
  t.innerHTML = msg;
  t.style.display = msg ? 'block' : 'none';
}

function setPill(text, cls){
  $('pillTxt').textContent = text;
  $('dot').className = 'dot ' + (cls || '');
}

function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}

async function loadSettings(){
  try{
    const s = await (await fetch('/api/settings')).json();
    if (s.host) $('host').value = s.host;
    if (s.user) $('user').value = s.user;
    if (s.port) $('port').value = s.port;
    if (s.roots) $('roots').value = s.roots;
    if (s.savePwd) $('savePwd').checked = false;
  }catch(e){}
}

function payload(){
  return {
    host: $('host').value.trim(),
    port: parseInt($('port').value || '22', 10),
    user: $('user').value.trim(),
    password: $('password').value,
    roots: $('roots').value,
    savePwd: $('savePwd').checked
  };
}

$('btnTest').onclick = async () => {
  const b = $('btnTest');
  b.disabled = true; b.textContent = '正在测试 ...';
  tip('正在连接并检测链路，请稍候（最长约 30 秒）...', 'warn');
  try{
    const r = await (await fetch('/api/test', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload())})).json();
    if (r.error){ tip('连接失败：' + r.error, 'err'); }
    else {
      let msg = '连接成功。<br>可用目录：' + (r.roots && r.roots.length ? r.roots.join('、') : '无');
      if (r.missing && r.missing.length) msg += '<br>不存在：' + r.missing.join('、');
      msg += '<br>下行吞吐：' + r.throughput;
      if (r.warning) { msg += '<br><br><b>注意：</b>' + r.warning; tip(msg, 'warn'); }
      else tip(msg, 'ok');
    }
  }catch(e){ tip('请求异常：' + e.message, 'err'); }
  b.disabled = false; b.textContent = '测试连接';
};

$('btnScan').onclick = async () => {
  const p = payload();
  if (!p.host || !p.user){ tip('请填写主机地址和用户名', 'err'); return; }
  if (window._mtuNeedFix){
    tip('检测到链路 MTU 异常：SSH 能连上但数据传输会卡死。请先点击上方黄色提示条里的「一键修复」，修复后再开始采集。', 'err');
    return;
  }
  $('reportFrame').style.display = 'none';
  $('reportFrame').src = 'about:blank';
  $('welcome').style.display = 'none';
  $('logs').style.display = 'block';
  $('logs').innerHTML = '';
  $('progressWrap').style.display = 'block';
  $('btnScan').disabled = true;
  started = Date.now();
  setPill('正在采集', 'run');
  tip('');

  try{
    const r = await (await fetch('/api/scan', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(p)})).json();
    if (r.error){ tip(r.error, 'err'); resetUi(); return; }
  }catch(e){ tip('请求异常：' + e.message, 'err'); resetUi(); return; }

  window._reportLoaded = false;
  if (timer) clearInterval(timer);
  timer = setInterval(poll, 500);
};

function resetUi(){
  $('btnScan').disabled = false;
  setPill('就绪', '');
  $('progressWrap').style.display = 'none';
  if (timer){ clearInterval(timer); timer = null; }
}

let logCount = 0;
async function poll(){
  let s;
  try{ s = await (await fetch('/api/status')).json(); }catch(e){ return; }

  $('mFiles').textContent = s.files;
  $('mSubs').textContent = s.subFiles;
  $('mBytes').textContent = fmtBytes(s.bytesRecv);
  $('mTime').textContent = (s.elapsed || 0) + 's';

  if (s.logs && s.logs.length > logCount){
    const box = $('logs');
    for (let i = logCount; i < s.logs.length; i++){
      const d = document.createElement('div');
      d.className = 'l' + (s.logs[i].indexOf('失败') >= 0 || s.logs[i].indexOf('异常') >= 0 ? ' er' : '');
      d.textContent = s.logs[i];
      box.appendChild(d);
    }
    logCount = s.logs.length;
    box.scrollTop = box.scrollHeight;
  }

  if (s.rootTotal > 0){
    const base = (s.phase === 'scanning' || s.phase === 'analyzing') ? 0.92 : 1;
    const pct = Math.min(95, Math.round((s.rootIdx / s.rootTotal) * 90) + (s.phase === 'analyzing' ? 93 : 0));
    $('barIn').style.width = pct + '%';
  }

  if (s.phase === 'done'){
    resetUi();
    setPill('已完成', 'done');
    $('barIn').style.width = '100%';
    if (!window._reportLoaded){
      window._reportLoaded = true;
      $('reportFrame').src = '/api/report?v=' + Date.now();
      $('reportFrame').style.display = 'block';
      $('logs').style.display = 'none';
      $('welcome').style.display = 'none';
      $('progressWrap').style.display = 'none';
      tip('采集完成，报表已生成并显示在右侧。文件同时保存在 exe 同目录的 reports 文件夹。', 'ok');
    }
  } else if (s.phase === 'error'){
    resetUi();
    setPill('出错了', 'err');
    tip(s.error || '采集失败', 'err');
  } else if (s.phase !== 'idle'){
    setPill(s.message || '处理中', 'run');
  }
}

async function loadMTU(){
  try{
    const m = await (await fetch('/api/mtu')).json();
    window._mtuNeedFix = !!m.needFix;
    const bar = $('mtubar');
    if (m.needFix){
      bar.style.display = 'block';
      bar.innerHTML = '<b>链路 MTU 不匹配：SSH 能连上，但数据几乎传不动（这就是"一直收不到数据"的原因）</b><br>' + m.advice +
        '<br>手动修复（管理员 CMD）：<code>' + m.fixHint + '</code>' +
        '<div class="acts"><button id="btnFix">一键修复（需管理员授权）</button><span id="fixMsg"></span></div>';
      $('btnFix').onclick = fixMTU;
    } else {
      bar.style.display = 'none';
    }
  }catch(e){}
}

async function fixMTU(){
  const b = $('btnFix');
  const ok = confirm('将把 Tailscale 虚拟网卡 MTU 调整为 1200，并写入系统持久设置。\n\n' +
    '影响：修复大包被丢弃导致的传输停滞；该网卡所有流量都会按 1200 MTU 发送，速度影响很小。\n' +
    '可随时改回：netsh interface ipv4 set subinterface "Tailscale" mtu=1280 store=persistent\n\n' +
    '注意：会弹出 Windows 管理员授权（UAC），需要你确认。\n\n是否继续？');
  if (!ok) return;
  b.disabled = true; b.textContent = '正在修复 ...';
  try{
    const r = await (await fetch('/api/fixmtu', {method:'POST'})).json();
    if (r.error){
      $('fixMsg').textContent = '修复失败：' + r.error;
      b.disabled = false; b.textContent = '一键修复（需管理员授权）';
    } else {
      $('fixMsg').textContent = r.ok;
      setTimeout(loadMTU, 1500);
    }
  }catch(e){
    $('fixMsg').textContent = '请求异常：' + e.message;
    b.disabled = false; b.textContent = '一键修复（需管理员授权）';
  }
}

$('btnDir').onclick = () => fetch('/api/opendir', {method:'POST'});

loadMTU();
loadSettings();

// 心跳：后端一旦进入采集/完成状态，界面自动接管并展示结果
setInterval(async () => {
  if (timer) return;
  try{
    const s = await (await fetch('/api/status')).json();
    if (s.phase === 'scanning' || s.phase === 'analyzing'){
      window._reportLoaded = false;
      timer = setInterval(poll, 500);
      poll();
    }
  }catch(e){}
}, 1500);
</script>
</body>
</html>
