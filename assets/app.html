<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影音库统计</title>
<style>
  * { box-sizing: border-box; }
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2331; --line:#2a3343;
    --txt:#e6edf3; --sub:#8b98a9; --acc:#4f8cff; --acc2:#7c5cff;
    --ok:#3fb950; --warn:#d29922; --err:#f85149;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:13px;}
  #app{display:flex;height:100%;}
  #side{width:352px;min-width:352px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);}
  #brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);}
  #brand h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.3px;}
  #brand p{margin:6px 0 0;font-size:11.5px;color:var(--sub);line-height:1.6;}
  #form{padding:16px 18px;overflow-y:auto;flex:1;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;color:var(--txt);font-size:12.5px;outline:none;transition:.15s;}
  .field input:focus,.field select:focus{border-color:var(--acc);background:#1e2836;}
  textarea{width:100%;min-height:92px;padding:8px 10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:12px;
    font-family:Consolas,"Courier New",monospace;resize:vertical;outline:none;line-height:1.7;}
  textarea:focus{border-color:var(--acc);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;}
  .chip{padding:3px 9px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
    font-size:11px;color:var(--sub);cursor:pointer;}
  .chip:hover{border-color:var(--acc);color:var(--acc);}
  .btn{width:100%;padding:10px;border:none;border-radius:6px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;margin-bottom:9px;}
  .btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--acc);color:var(--acc);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  #tip{margin-top:10px;padding:10px;border-radius:6px;font-size:11.5px;line-height:1.7;display:none;}
  #tip.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35);color:#7ee787;display:block;}
  #tip.warn{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.35);color:#e3b341;display:block;}
  #tip.err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.35);color:#ff7b72;display:block;}
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #topbar{height:46px;min-height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;
    border-bottom:1px solid var(--line);background:var(--panel);}
  #pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
    background:var(--panel2);font-size:11.5px;color:var(--sub);border:1px solid var(--line);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sub);}
  .dot.run{background:var(--acc);animation:blink 1.1s infinite;}
  .dot.done{background:var(--ok);} .dot.err{background:var(--err);}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  #metrics{margin-left:auto;display:flex;gap:20px;font-size:11.5px;color:var(--sub);}
  #metrics b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums;}
  #stage{flex:1;position:relative;display:flex;overflow:hidden;}
  #welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;color:var(--sub);gap:8px;padding:30px;}
  #welcome h2{font-size:17px;color:var(--txt);margin:0 0 4px;font-weight:600;}
  #welcome p{margin:0;font-size:12.5px;line-height:1.9;max-width:560px;}
  #welcome code{background:var(--panel2);padding:1px 6px;border-radius:4px;color:#79c0ff;font-size:11.5px;}
  #logs{width:100%;height:100%;overflow-y:auto;padding:14px 18px;font-family:Consolas,monospace;
    font-size:11.5px;line-height:1.85;color:var(--sub);display:none;}
  #logs .l{white-space:pre-wrap;word-break:break-all;}
  #logs .l.er{color:var(--err);}
  #reportFrame{width:100%;height:100%;border:none;display:none;background:#fff;}
  #dots{padding:0 18px 14px;display:none;}
  #bar{height:4px;background:var(--panel2);border-radius:3px;overflow:hidden;}
  #barIn{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s;}
  /* 目录浏览弹层 */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;}
  #modal.show{display:flex;}
  #mbox{width:620px;max-width:92vw;height:70vh;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    display:flex;flex-direction:column;overflow:hidden;}
  #mhead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12.5px;}
  #mpath{flex:1;font-family:Consolas,monospace;color:#79c0ff;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #mhead button{padding:4px 10px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);
    color:var(--txt);font-size:11.5px;cursor:pointer;font-family:inherit;}
  #mlist{flex:1;overflow-y:auto;padding:6px 0;}
  .mrow{padding:8px 16px;font-size:12.5px;cursor:pointer;display:flex;gap:8px;align-items:center;}
  .mrow:hover{background:var(--panel2);}
  .mrow .tag{font-size:10px;color:var(--ok);border:1px solid rgba(63,185,80,.4);border-radius:4px;padding:0 4px;}
  #mfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:10px;}
  #mfoot button{flex:1;padding:8px;border-radius:6px;border:none;font-size:12.5px;cursor:pointer;font-family:inherit;}
  #pick{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;}
  #close{background:var(--panel2);color:var(--txt);border:1px solid var(--line)!important;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#30394a;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand">
      <h1>影音库统计</h1>
      <p>本机只读扫描 NAS 影音文件，生成统计报表</p>
    </div>
    <div id="form">
      <div class="field">
        <label>扫描目录（每行一个）</label>
        <textarea id="roots" spellcheck="false"></textarea>
      </div>
      <div class="chips" id="volChips"></div>
      <button class="btn btn-ghost" id="btnBrowse">浏览并添加目录</button>
      <button class="btn btn-ghost" id="btnSave">保存目录设置</button>
      <button class="btn btn-primary" id="btnScan">开始采集</button>
      <div id="tip"></div>
      <div class="field" style="margin-top:16px">
        <label>已生成报表</label>
        <div id="repList" style="font-size:11.5px;color:var(--sub);line-height:1.9">暂无</div>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <span id="pill"><span class="dot" id="dot"></span><span id="pillTxt">就绪</span></span>
      <div id="metrics">
        <span>视频 <b id="mFiles">0</b></span>
        <span>附属 <b id="mSubs">0</b></span>
        <span>数据 <b id="mBytes">0 B</b></span>
        <span>耗时 <b id="mTime">0s</b></span>
      </div>
    </div>
    <div id="dots"><div id="bar"><div id="barIn"></div></div></div>
    <div id="stage">
      <div id="welcome">
        <h2>选择扫描目录后开始采集</h2>
        <p>程序以只读方式遍历 NAS 上的视频与字幕文件，全部解析在 NAS 本机完成，不会修改任何文件。<br>
        若提示无权限，请在「飞牛应用中心 → 影音库统计 → 应用设置 → 授权目录」中放行对应目录。<br>
        报表生成后可在线查看，也可在左侧下载 HTML / CSV。</p>
      </div>
      <div id="logs"></div>
      <iframe id="reportFrame"></iframe>
    </div>
  </main>
</div>

<div id="modal">
  <div id="mbox">
    <div id="mhead">
      <span id="mpath">/</span>
      <button id="up">上级</button>
      <button id="close">关闭</button>
    </div>
    <div id="mlist"></div>
    <div id="mfoot"><button id="pick">添加当前目录</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let timer = null, logCount = 0, curPath = "/";

function tip(msg, kind){
  const t = $('tip');
  t.className = kind || '';
  t.innerHTML = msg || '';
  t.style.display = msg ? 'block' : 'none';
}
function setPill(text, cls){
  $('pillTxt').textContent = text;
  $('dot').className = 'dot ' + (cls || '');
}
function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n/1024/1024).toFixed(2) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}
function rootsArr(){
  return $('roots').value.split('\n').map(s=>s.trim()).filter(s=>s);
}

async function loadEnv(){
  try{
    const e = await (await fetch('/api/env')).json();
    const box = $('volChips');
    box.innerHTML = '';
    (e.volumes||[]).forEach(v=>{
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = '+ ' + v.label;
      c.onclick = ()=> addRoot(v.path);
      box.appendChild(c);
    });
  }catch(err){}
}
function addRoot(p){
  const arr = rootsArr();
  if (arr.indexOf(p) >= 0) return;
  arr.push(p);
  $('roots').value = arr.join('\n');
}

async function loadSettings(){
  try{
    const s = await (await fetch('/api/settings')).json();
    $('roots').value = (s.roots||[]).join('\n');
  }catch(e){}
}

async function loadReports(){
  try{
    const r = await (await fetch('/api/reports')).json();
    const files = r.files || [];
    if (!files.length){ $('repList').textContent = '暂无'; return; }
    $('repList').innerHTML = files.slice(0,10).map(f=>
      '<div><a href="'+f.url+'" style="color:#79c0ff;text-decoration:none">'+f.name+'</a><br>'+
      '<span style="color:#5b6675">'+f.time+' · '+fmtBytes(f.size)+'</span></div>').join('');
  }catch(e){}
}

$('btnSave').onclick = async ()=>{
  const r = await (await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({roots: rootsArr()})})).json();
  if (r.error) tip(r.error,'err'); else tip('目录设置已保存。','ok');
};

$('btnScan').onclick = async ()=>{
  const roots = rootsArr();
  if (!roots.length){ tip('请至少填写一个扫描目录','err'); return; }
  $('reportFrame').style.display='none';
  $('welcome').style.display='none';
  $('logs').style.display='block';
  $('logs').innerHTML='';
  $('dots').style.display='block';
  $('btnScan').disabled=true;
  logCount=0;
  setPill('正在采集','run');
  tip('');
  try{
    const r = await (await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({roots: roots})})).json();
    if (r.error){ tip(r.error,'err'); resetUi(); return; }
  }catch(e){ tip('请求异常：'+e.message,'err'); resetUi(); return; }
  if (timer) clearInterval(timer);
  timer = setInterval(poll, 600);
};

function resetUi(){
  $('btnScan').disabled=false;
  $('dots').style.display='none';
  if (timer){ clearInterval(timer); timer=null; }
}

async function poll(){
  let s;
  try{ s = await (await fetch('/api/status')).json(); }catch(e){ return; }
  $('mFiles').textContent = s.files||0;
  $('mSubs').textContent = s.sub_files||0;
  $('mBytes').textContent = fmtBytes(s.bytesRecv||0);
  $('mTime').textContent = (s.elapsed||0)+'s';

  if (s.logs && s.logs.length > logCount){
    const box=$('logs');
    for (let i=logCount;i<s.logs.length;i++){
      const d=document.createElement('div');
      const line=s.logs[i]||'';
      d.className='l'+((line.indexOf('失败')>=0||line.indexOf('异常')>=0||line.indexOf('无权限')>=0)?' er':'');
      d.textContent=line;
      box.appendChild(d);
    }
    logCount=s.logs.length;
    box.scrollTop=box.scrollHeight;
  }
  if (s.rootTotal>0){
    let pct = Math.round((s.rootIdx/s.rootTotal)*92);
    if (s.phase==='analyzing') pct = 96;
    $('barIn').style.width = Math.min(96,pct)+'%';
  }
  if (s.phase==='done'){
    resetUi();
    setPill('已完成','done');
    $('barIn').style.width='100%';
    $('reportFrame').src='/api/report?v='+Date.now();
    $('reportFrame').style.display='block';
    $('logs').style.display='none';
    $('welcome').style.display='none';
    tip('采集完成，报表已显示在右侧，文件已保存到数据目录 reports 下。','ok');
    loadReports();
  } else if (s.phase==='error'){
    resetUi();
    setPill('出错了','err');
    tip(s.error||'采集失败','err');
  } else if (s.phase!=='idle'){
    setPill(s.message||'处理中','run');
  }
}

// ---- 目录浏览 ----
async function browse(p){
  curPath = p || '/';
  const r = await (await fetch('/api/browse?path='+encodeURIComponent(curPath))).json();
  $('mpath').textContent = curPath;
  const list = $('mlist');
  list.innerHTML='';
  if (r.error){
    const d=document.createElement('div'); d.className='mrow'; d.style.color='#ff7b72';
    d.textContent=r.error; list.appendChild(d); return;
  }
  (r.items||[]).forEach(it=>{
    const d=document.createElement('div');
    d.className='mrow';
    d.innerHTML='<span>📁 '+it.name+'</span>'+(it.media?'<span class="tag">含影音</span>':'');
    d.onclick=()=>browse(it.path);
    list.appendChild(d);
  });
  if (!(r.items||[]).length){
    const d=document.createElement('div'); d.className='mrow'; d.style.color='#5b6675';
    d.textContent='（无子目录）'; list.appendChild(d);
  }
}
$('btnBrowse').onclick = ()=>{ $('modal').classList.add('show'); browse(curPath); };
$('close').onclick = ()=> $('modal').classList.remove('show');
$('up').onclick = ()=>{ const p=curPath.replace(/\/+$/,''); browse(p.substring(0,p.lastIndexOf('/'))||'/'); };
$('pick').onclick = ()=>{ if (curPath && curPath!=='/'){ addRoot(curPath); tip('已添加：'+curPath,'ok'); } $('modal').classList.remove('show'); };

loadEnv(); loadSettings(); loadReports();
setInterval(async ()=>{
  if (timer) return;
  try{
    const s = await (await fetch('/api/status')).json();
    if (s.phase==='scanning'||s.phase==='analyzing'){
      timer=setInterval(poll,600); poll();
    } else if (s.phase==='done' && $('reportFrame').style.display!=='block'){
      poll();
    }
  }catch(e){}
}, 1500);
</script>
</body>
</html>
