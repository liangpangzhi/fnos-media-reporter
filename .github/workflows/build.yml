name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/FnosMediaReporterGUI.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FnosMediaReporterGUI-windows-amd64
          path: dist/FnosMediaReporterGUI.exe
          if-no-files-found: error

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "dist/FnosMediaReporterGUI.exe" --title $tag --notes "Automated build for $tag"
          } else {
            gh release upload $tag "dist/FnosMediaReporterGUI.exe" --clobber
          }
